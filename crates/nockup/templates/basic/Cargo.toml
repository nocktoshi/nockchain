[package]
# Placeholder names for template; replaced when scaffolding. Must be valid for Cargo when repo is used as a git dep.
name = "nockup-template-basic"
version = "0.1.0"
edition = "2021"
authors = ["Nockchain <nockchain@nockchain.org>"]
description = "A NockApp project (template)"

[[bin]]
name = "nockup-template-basic"
path = "src/main.rs"

[dependencies]
# NockVM dependency; rev is replaced when scaffolding
nockapp = { git = "https://github.com/nockchain/nockchain.git" }
nockvm = { git = "https://github.com/nockchain/nockchain.git" }
nockvm_macros = { git = "https://github.com/nockchain/nockchain.git" }

# Common dependencies for NockApps
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
anyhow = "1.0"
bytes = "1.5.0"
tokio = { version = "1.32", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "rt",
  "signal",
] }
tokio-util = "0.7.11"

[build-dependencies]
# Build script dependencies if needed